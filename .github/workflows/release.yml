name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: SMK8P-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: SMK8P-macos-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: SMK8P-linux-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $stage = "stage/SMK8P"
          New-Item -ItemType Directory -Path $stage -Force
          Copy-Item "target/${{ matrix.target }}/release/smk-client.exe" "$stage/SMK8P.exe"

          New-Item -ItemType Directory -Path "$stage/cores/snes9x-libretro" -Force
          Copy-Item "cores/snes9x-libretro/snes9x_libretro.dll" "$stage/cores/snes9x-libretro/snes9x_libretro.dll"

          if (Test-Path "patches") {
            Copy-Item -Recurse "patches" "$stage/patches"
          }
          Compress-Archive -Path $stage -DestinationPath ${{ matrix.asset_name }}

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP="stage/SMK8P.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/smk-client" "$APP/Contents/MacOS/smk-client"
          cp "assets/Info.plist" "$APP/Contents/Info.plist"
          cp "assets/icon.icns" "$APP/Contents/Resources/icon.icns"

          mkdir -p "$APP/Contents/MacOS/cores/snes9x-libretro"
          cp "cores/snes9x-libretro/snes9x_libretro.dylib" "$APP/Contents/MacOS/cores/snes9x-libretro/snes9x_libretro.dylib"

          if [ -d "patches" ]; then
            cp -R "patches" "$APP/Contents/MacOS/patches"
          fi
          cd stage && zip -r "../${{ matrix.asset_name }}" "SMK8P.app"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          STAGE="stage/SMK8P"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/smk-client" "$STAGE/SMK8P"

          mkdir -p "$STAGE/cores/snes9x-libretro"
          cp "cores/snes9x-libretro/snes9x_libretro.so" "$STAGE/cores/snes9x-libretro/snes9x_libretro.so"

          if [ -d "patches" ]; then
            cp -R "patches" "$STAGE/patches"
          fi
          cd stage && zip -r "../${{ matrix.asset_name }}" "SMK8P"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -name "*.zip" -exec cp {} release/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          draft: false
          generate_release_notes: true