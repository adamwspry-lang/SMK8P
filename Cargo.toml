[package]
name = "smk-client"
version = "0.2.0"
edition = "2024"

[dependencies]
retro-rs = "0.5"
rfd = "0.14"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.29"
egui = { version = "0.29", features = ["serde"] }
cpal = "0.15"
gilrs = { version = "0.10", features = ["serde-serialize"] }
image = { version = "0.25", default-features = false, features = ["png"] }
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[patch.crates-io]
retro-rs = { path = "retro-rs-local" }